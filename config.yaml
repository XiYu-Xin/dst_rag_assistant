# DST RAG Assistant Configuration

project:
  name: "DST_RAG_Assistant"
  version: "1.0.0"

wiki:
  base_url: "https://dontstarve.huijiwiki.com/api.php"
  language: "zh"
  categories:
    - "生物"
    - "物品"
    - "食物"
    - "科技"
    - "角色"
    - "巨人"
    - "机制"
    - "环境"
    - "世界"
    - "行为"
    - "玩家"
  max_depth: 3
  request_delay: 1.0
  rate_limit: 5

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  dim: 384
  device: "cpu"
  batch_size: 32
  normalize: true

vector_store:
  type: "faiss"
  index_type: "FlatIP"
  nlist: 100
  metric: "cosine"

chunking:
  strategy: "semantic"
  chunk_size: 512
  chunk_overlap: 64
  separators: ["\n\n", "\n", "。", "；", " "]
  min_chunk_size: 100

# 混合检索: weighted 融合模式下 BM25 权重 0.7（中文关键词优先）
hybrid_search:
  enabled: true
  fusion_method: "weighted"
  vector_weight: 0.3
  bm25_weight: 0.7
  rrf_k: 60
  top_k_candidate: 20
  top_k_final: 5

reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k_rerank: 10
  device: "cpu"

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"
  temperature: 0.3
  max_tokens: 2048

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

frontend:
  type: "streamlit"
  port: 8501

logging:
  level: "INFO"
  rotation: "50 MB"
  retention: "7 days"
  log_path: "logs/dst_rag.log"
